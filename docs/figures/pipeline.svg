<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Project pipeline</title>
  <desc id="desc">The Kaggle dataset is split by biscuit with prepare_data.py, then feeds two tracks: supervised four-class defect classification, and one-class anomaly detection trained on OK biscuits only, using either reconstruction error or feature distance.</desc>
  <style>
    svg { --t1:#0b0b0b; --t2:#52514e; --box:#f6f5f2; --line:#cfcdc7; --accent:#2a78d6; --accent-bg:#e8f0fb; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    @media (prefers-color-scheme: dark) { svg { --t1:#f0efec; --t2:#c3c2b7; --box:#1c1c1b; --line:#45443f; --accent:#3987e5; --accent-bg:#14243a; } }
    .t1 { fill:var(--t1); } .t2 { fill:var(--t2); } .acc { fill:var(--accent); }
    .box { fill:var(--box); stroke:var(--line); stroke-width:1.5; }
    .hl  { fill:var(--accent-bg); stroke:var(--accent); stroke-width:1.5; }
    .arrow { fill:none; stroke:var(--t2); stroke-width:1.75; marker-end:url(#head); }
    .h { font-size:15px; font-weight:600; } .b { font-size:13px; } .s { font-size:12px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--t2)"/>
    </marker>
  </defs>

  <!-- Data -->
  <rect class="box" x="10" y="145" width="185" height="110" rx="8"/>
  <text class="t1 h" x="102" y="178" text-anchor="middle">Kaggle dataset</text>
  <text class="t2 b" x="102" y="202" text-anchor="middle">1,225 biscuits</text>
  <text class="t2 b" x="102" y="220" text-anchor="middle">× 4 rotations</text>
  <text class="t2 b" x="102" y="238" text-anchor="middle">= 4,900 images, 4 classes</text>

  <path class="arrow" d="M195 200 H228"/>

  <!-- Split -->
  <rect class="hl" x="230" y="145" width="185" height="110" rx="8"/>
  <text class="t1 h mono" x="322" y="178" text-anchor="middle" style="font-size:14px">prepare_data.py</text>
  <text class="t2 b" x="322" y="202" text-anchor="middle">split by biscuit,</text>
  <text class="t2 b" x="322" y="220" text-anchor="middle">never by image —</text>
  <text class="t2 b" x="322" y="238" text-anchor="middle">rotations can't leak</text>

  <path class="arrow" d="M415 200 H438 V95 H458"/>
  <path class="arrow" d="M438 200 V290 H458"/>

  <!-- Supervised track -->
  <rect class="box" x="460" y="20" width="430" height="150" rx="8"/>
  <text class="t1 h" x="478" y="48">Supervised · which defect is it?</text>
  <text class="t2 s" x="872" y="48" text-anchor="end">phase 2</text>
  <text class="t2 b" x="478" y="72">Train on all four labelled classes</text>
  <text class="t1 b" x="478" y="100">Basic CNN · Advanced CNN (Keras Tuner)</text>
  <text class="t1 b" x="478" y="120">ResNet50V2 · EfficientNet · MobileNetV3 (fine-tuned)</text>
  <text class="acc b" x="478" y="150" style="font-weight:600">→ OK · broken shape · foreign object · color stain</text>

  <!-- One-class track -->
  <rect class="box" x="460" y="190" width="430" height="200" rx="8"/>
  <text class="t1 h" x="478" y="218">One-class · is anything wrong?</text>
  <text class="t2 s" x="872" y="218" text-anchor="end">phases 1 + 2</text>
  <text class="t2 b" x="478" y="242">Train on OK biscuits only — no defect labels needed</text>

  <rect class="box" x="476" y="256" width="196" height="84" rx="6"/>
  <text class="t1 b" x="574" y="280" text-anchor="middle" style="font-weight:600">Reconstruction error</text>
  <text class="t2 s" x="574" y="302" text-anchor="middle">Autoencoder · VAE · DCGAN</text>
  <text class="t2 s" x="574" y="320" text-anchor="middle">ViT-VAE · DDPM diffusion</text>

  <rect class="box" x="680" y="256" width="196" height="84" rx="6"/>
  <text class="t1 b" x="778" y="280" text-anchor="middle" style="font-weight:600">Feature distance</text>
  <text class="t2 s" x="778" y="302" text-anchor="middle">frozen ResNet18 features</text>
  <text class="t2 s" x="778" y="320" text-anchor="middle">+ One-Class SVM</text>

  <text class="acc b" x="478" y="370" style="font-weight:600">→ anomaly score → OK / defective → cluster the flags</text>
</svg>
